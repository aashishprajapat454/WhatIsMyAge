<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>what is my age</title>
    <style>
        body {
            background-color: gray;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
        }

        input[type="date"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .result {
            margin-top: 20px;
        }

        .result h2 {
            color: white;
            font-size: 28px;
            margin: 10px 0;
        }

        .years,
        .monts,
        .days {
            font-size: 24px;
        }
    </style>
</head>

<body style="background-color: gray;">
    <h1>what is my age</h1>
    <input type="date" id="dob">
    <button type="submit" id="chack">chack</button>
    <div class="result">
        <h2 class="years"></h2>
        <h2 class="monts"></h2>
        <h2 class="days"></h2>

    </div>
</body>
<script src="script.js"></script>
</html>
